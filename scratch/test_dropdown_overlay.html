<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{
  --paper:#FDFBF7; --surface:#FFFFFF; --surface-2:#FAF5ED;
  --ink:#171410; --line:#E6DAC6; --accent:#E06012; --accent-soft:#FFF1E5;
  --r:10px;
}
body{font-family:sans-serif;background:var(--paper);padding:30px}
.modal{width:540px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:20px;position:relative}
.field{margin-bottom:14px}
.ms-container{position:relative}
.ms-trigger{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;min-height:42px;box-sizing:border-box}
.ms-menu{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#ffffff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,0.2);z-index:9999;padding:8px;box-sizing:border-box}
.ms-opts-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow-y:auto;margin-top:6px}
.ms-opt-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;background:#fff;transition:background 0.15s;box-sizing:border-box}
.ms-opt-row:hover{background:var(--surface-2)}
.ms-opt-row.selected{background:var(--accent-soft)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="modal">
  <div class="field ms-container">
    <label style="font-weight:600;display:block;margin-bottom:6px">Facilitators (from hierarchy)</label>
    <div class="ms-trigger">
      <div style="display:flex;gap:6px">
        <span style="background:var(--accent-soft);border:1px solid var(--accent);padding:3px 8px;border-radius:14px;font-size:12px">🧑‍🏫 Dhirendra pr ×</span>
      </div>
      <span>▲</span>
    </div>
    <div class="ms-menu">
      <div style="display:flex;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)">
        <input type="text" placeholder="Filter facilitators..." style="flex:1">
        <button style="padding:4px 8px">All</button>
        <button style="padding:4px 8px">Clear</button>
      </div>
      <div class="ms-opts-list">
        <label class="ms-opt-row"><input type="checkbox"> <span>🧑‍🏫 Surya Narayana Das</span></label>
        <label class="ms-opt-row"><input type="checkbox"> <span>🧑‍🏫 Audarya Gaur pr</span></label>
        <label class="ms-opt-row selected"><input type="checkbox" checked> <span style="font-weight:600">🧑‍🏫 Dhirendra pr</span> <span style="margin-left:auto;color:var(--accent)">✓</span></label>
      </div>
      <div style="display:flex;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line);margin-top:6px">
        <button style="background:var(--accent);color:#fff;border:none;padding:5px 14px;border-radius:6px;cursor:pointer">Done ✓</button>
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="field"><label>Meeting frequency</label><select><option>Weekly</option></select></div>
    <div class="field"><label>Meeting day</label><select><option>Tue</option></select></div>
  </div>
  <div class="form-row">
    <div class="field"><label>Class time</label><input type="text" value="6:30 pm"></div>
    <div class="field"><label>Start date</label><input type="date" value="2025-09-22"></div>
  </div>
</div>
</body>
</html>
