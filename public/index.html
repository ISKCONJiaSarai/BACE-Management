async function deleteDevoteeAction(id){
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  try{
    toast(`Deleting ${name}...`, '⏳');
    if(token){
      const res = await fetch(`/api/devotees/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(!res.ok && res.status !== 404){
        const data = await res.json().catch(()=>({}));
        throw new Error(data.message || 'Failed to delete on server');
      }
    }
    // Remove from local in-memory DB
    const idx = DB.devotees.findIndex(x => x.id === id || x.customId === id);
    if(idx !== -1) DB.devotees.splice(idx, 1);

    DB.assignments = DB.assignments.filter(a => a.devotee !== id);
    DB.attendance = DB.attendance.filter(a => a.devotee !== id);
    DB.deptMembers = DB.deptMembers.filter(m => m.devotee !== id);
    DB.careGroups.forEach(g => { g.members = (g.members||[]).filter(m => m !== id); });

    logAudit('Devotee Deleted', `${name} deleted from database`);
    toast(`${name} deleted from database`, '🗑️');
    APP.modal = '';
    APP.deleteDevoteeTarget = null;
    if(APP.route.startsWith('#/devotee/')){
      go('#/devotees');
    } else {
      render();
    }
  }catch(err){
    console.error(err);
    toast(err.message || 'Delete failed', '❌');
  }
}


async function approveDevoteeAction(id){
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  try{
    toast(`Approving ${name}...`, '⏳');
    if(token){
      const res = await fetch(`/api/auth/approve-devotee/${id}`,{
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + token}
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error(data.message || 'Approval failed on server');
    }
    if(d){
      d.status = 'Active';
    }
    const u = DB.users.find(x => x.devotee === id || x.id === id);
    if(u){
      u.approvalStatus = 'approved';
    }
    logAudit('Devotee Approved', `${name} approved by Area Leader`);
    toast(`${name} approved successfully! They can now log in.`, '✅');
    render();
  }catch(err){
    console.error(err);
    toast(err.message || 'Approval failed', '❌');
  }
}

async function rejectDevoteeAction(id){
  const reason = prompt('Please enter the reason for rejection (optional):');
  if(reason === null) return;
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  try{
    if(token){
      await fetch(`/api/auth/reject-devotee/${id}`,{
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
        body: JSON.stringify({reason})
      });
    }
    if(d){ d.status = 'Inactive'; }
    const u = DB.users.find(x => x.devotee === id || x.id === id);
    if(u){ u.approvalStatus = 'rejected'; u.rejectionReason = reason; }
    logAudit('Devotee Rejected', `${name} registration declined: ${reason || 'No reason specified'}`);
    toast(`Registration for ${name} declined`, 'ℹ️');
    render();
  }catch(err){
    console.error(err);
    toast(err.message || 'Action failed', '❌');
  }
}

function refocus(sel,caretEnd=true){
  const el=document.querySelector(sel);if(!el)return;
  el.focus();if(caretEnd&&el.setSelectionRange&&el.type!=='date'&&el.type!=='number'){const v=el.value;try{el.setSelectionRange(v.length,v.length)}catch(e){}}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  const link=e.target.closest('a[href^="#/"]');
  if(link&&!t){e.preventDefault();go(link.getAttribute('href'));return}
  if(!t){return}
  const a=t.dataset.act,id=t.dataset.id;
  // links that also carry data-act
  if(t.tagName==='A'&&t.getAttribute('href')&&t.getAttribute('href').startsWith('#/')&&['drill'].includes(a)===false&&!['open-devotee','open-activity','open-contact','open-dept','open-batch','open-group','open-sop'].includes(a)){
    e.preventDefault();go(t.getAttribute('href'));return}
  const stop=()=>{e.preventDefault();e.stopPropagation()};
  switch(a){
  /* ---- session / navigation ---- */
  case 'pick-user':loginPick=id;render();break;
  case 'login':{const u=DB.users.find(x=>x.id===loginPick);APP.user={...u};
    APP.nav.open={mgmt:can('management',u.role),preach:can('preaching',u.role)&&!can('management',u.role),care:can('care',u.role)&&!can('management',u.role)&&!can('preaching',u.role)};
    if(!APP.nav.open.mgmt&&!APP.nav.open.preach&&!APP.nav.open.care)APP.nav.open.mgmt=true;
    go('#/');break}
  case 'account':APP.modal='account';render();break;
  case 'switch-user':APP.modal='account';render();break;
  case 'logout':localStorage.removeItem('bace_token');localStorage.removeItem('bace_user');APP.user=null;APP.modal='';render();toast('Signed out successfully','👋');break;
  case 'check-approval-status':checkApprovalStatus();break;
  case 'approve-devotee':stop();approveDevoteeAction(id);break;

/* keep assign-modal form values when the modal re-renders */
function syncAssign(){
  const d=APP.draft.assign;if(!d)return;
  ['name','date','start','end','location','desc','priority','budget','dept','batch'].forEach(n=>{
    const el=document.querySelector(`.modal [name=${n}]`);if(el)d[n]=el.value});
}
/* change events: selects and checkboxes that carry data-act */
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  switch(a){
   case 'f':{const k=t.dataset.k,n=t.dataset.n;APP.filters[k]=APP.filters[k]||{};APP.filters[k][n]=t.value;APP.page[k]=1;render();break}
   case 'range':APP.range[t.dataset.n]=t.value;render();break;
   case 'att-batch':APP.filters.attBatch=t.value;APP.filters.attClass=null;render();break;
   case 'att-class':APP.filters.attClass=t.value;render();break;
   case 'att-act':APP.filters.attAct=t.value;render();break;
   case 'cal-cat':APP.filters.calCat=t.value;render();break;
   case 'rep-batch':APP.filters.repBatch=t.value;render();break;
   case 'vol-f':{syncAssign();assignDraft()[t.dataset.n]=t.value;render();break}
  }
});
/* input events: search fields with focus retention */
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='f'){const k=t.dataset.k,n=t.dataset.n;APP.filters[k]=APP.filters[k]||{};APP.filters[k][n]=t.value;APP.page[k]=1;
    render();refocus(`[data-act="f"][data-k="${k}"][data-n="${n}"]`);}
  else if(a==='vol-q'){syncAssign();assignDraft().q=t.value;render();refocus('[data-act="vol-q"]')}
  else if(a==='pick-q'){APP.modal.q=t.value;render();refocus('#pickq')}
  else if(a==='global-search'){APP.search=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&APP.modal){APP.modal='';render();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='msg-key'&&e.key==='Enter'){
    const th=DB.threads.find(x=>x.id===APP.chat.thread);
    if(th&&t.value.trim()){th.messages.push({id:uid('m'),from:APP.user.devotee,text:t.value.trim(),at:nowTime(),date:iso(TODAY),pinned:false});render()}}
  if(t.dataset.act==='global-search'&&e.key==='Enter'&&APP.search.trim()){APP.modal='search';render()}
});
/* chart tooltips */
(function tooltips(){
  let tip;
  const show=(el,x,y)=>{
    const txt=el.getAttribute('data-tip');if(!txt)return;
    if(!tip){tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip)}
    const lines=txt.split('\n');
    tip.innerHTML=`<b>${esc(lines[0])}</b>${lines.slice(1).map(l=>`<br>${esc(l)}`).join('')}`;
    tip.style.display='block';
    const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.min(window.innerWidth-w-10,Math.max(8,x-w/2))+'px';
    tip.style.top=(y-h-12<8?y+18:y-h-12)+'px';
  };
  const hide=()=>{if(tip)tip.style.display='none'};
  document.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tip]');
    if(el)show(el,e.clientX,e.clientY);else hide();
  });
  document.addEventListener('touchstart',e=>{
    const el=e.target.closest('[data-tip]');
    if(el){const t0=e.touches[0];show(el,t0.clientX,t0.clientY);setTimeout(hide,2600)}
  },{passive:true});
  window.addEventListener('scroll',hide,{passive:true});
})();
/* kanban drag and drop for the preaching pipeline */
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{const col=e.target.closest('.kcol');if(col){e.preventDefault();col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('.kcol');if(col)col.classList.remove('over')});
document.addEventListener('drop',e=>{
  const col=e.target.closest('.kcol');if(!col)return;e.preventDefault();col.classList.remove('over');
  const id=e.dataTransfer.getData('text/plain'),c=contact(id);if(!c)return;
  const st=col.dataset.stage;c.stage=st;c.last=iso(TODAY);
  c.timeline.unshift({date:iso(TODAY),title:'Moved to '+st,desc:'Stage changed by '+nameOf(APP.user.devotee)+'.',tone:'indigo'});
  logAudit('Contact stage changed',`${c.name} → ${st}`);toast(c.name+' moved to '+st);render();
});
