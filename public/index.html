let lastDevoteesSync = 0;
async function syncDevoteesFromServer(){
  const token = localStorage.getItem('bace_token');
  if(!token || Date.now() - lastDevoteesSync < 10000) return;
  lastDevoteesSync = Date.now();
  try {
    const res = await fetch('/api/devotees', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if(!res.ok) return;
    const json = await res.json();
    if(json.success && Array.isArray(json.data)){
      let changed = false;
      json.data.forEach(serverDev => {
        if(isBaceAdminEmail(serverDev.email) || serverDev.appointment === 'BACE Administrator') return;
        const targetId = String(serverDev.customId || serverDev._id || serverDev.id || '');
        const serverName = (serverDev.name || '').trim().toLowerCase();
        
        let localDev = DB.devotees.find(x => 
          (targetId && (String(x.id) === targetId || String(x.customId) === targetId)) ||
          (x.name && x.name.trim().toLowerCase() === serverName) ||
          (serverDev.email && x.email && x.email.trim().toLowerCase() === serverDev.email.trim().toLowerCase())
        );

        // Resolve relational references to match local IDs and map MongoDB _id
        let resolvedBatchId = null;
        if(serverDev.batch){
          const bMatch = batch(serverDev.batch);
          if(bMatch){
            if(typeof serverDev.batch === 'object' && serverDev.batch._id) bMatch._id = String(serverDev.batch._id);
            resolvedBatchId = bMatch.id;
          } else {
            resolvedBatchId = typeof serverDev.batch === 'object' ? (serverDev.batch._id || serverDev.batch.id) : serverDev.batch;
          }
        }
        let resolvedDeptId = null;
        if(serverDev.dept){
          const dMatch = dept(serverDev.dept);
          if(dMatch){
            if(typeof serverDev.dept === 'object' && serverDev.dept._id) dMatch._id = String(serverDev.dept._id);
            resolvedDeptId = dMatch.id;
          } else {
            resolvedDeptId = typeof serverDev.dept === 'object' ? (serverDev.dept._id || serverDev.dept.id) : serverDev.dept;
          }
        }
        let resolvedGroupId = null;
        if(serverDev.careGroup){
          const gMatch = group(serverDev.careGroup);
          if(gMatch){
            if(typeof serverDev.careGroup === 'object' && serverDev.careGroup._id) gMatch._id = String(serverDev.careGroup._id);
            resolvedGroupId = gMatch.id;
          } else {
            resolvedGroupId = typeof serverDev.careGroup === 'object' ? (serverDev.careGroup._id || serverDev.careGroup.id) : serverDev.careGroup;
          }
        }

        if(!localDev){
          localDev = normalizeDevotee({
            ...serverDev,
            id: targetId || ('d_' + Date.now()),
            batch: resolvedBatchId,
            dept: resolvedDeptId,
            careGroup: resolvedGroupId
          });
          DB.devotees.push(localDev);
          changed = true;
        } else {
          if(serverDev._id && !localDev._id) localDev._id = String(serverDev._id);
          if(serverDev.phone && localDev.phone !== serverDev.phone) { localDev.phone = serverDev.phone; changed = true; }
          if(serverDev.email && localDev.email !== serverDev.email) { localDev.email = serverDev.email; changed = true; }
          if(resolvedBatchId && localDev.batch !== resolvedBatchId) { localDev.batch = resolvedBatchId; changed = true; }
          if(resolvedDeptId && localDev.dept !== resolvedDeptId) { localDev.dept = resolvedDeptId; changed = true; }
          if(resolvedGroupId && localDev.careGroup !== resolvedGroupId) { localDev.careGroup = resolvedGroupId; changed = true; }
          if(serverDev.batchRole && localDev.batchRole !== serverDev.batchRole) { localDev.batchRole = serverDev.batchRole; changed = true; }
          if(serverDev.status && localDev.status !== serverDev.status) { localDev.status = serverDev.status; changed = true; }
          if(serverDev.level !== undefined && localDev.level !== serverDev.level) { localDev.level = serverDev.level; changed = true; }
          if(serverDev.appointment && localDev.appointment !== serverDev.appointment) {
            localDev.appointment = serverDev.appointment;
            changed = true;
          }

          // If current logged in devotee's role or appointment was changed on server
          const isMeSync = APP.user && (
            APP.user.devotee === localDev.id ||
            APP.user.devotee === localDev.customId ||
            (localDev.email && APP.user.email && localDev.email.toLowerCase().trim() === APP.user.email.toLowerCase().trim())
          );
          if (isMeSync) {
            const serverRoleKey = devoteeRole(localDev);
            if (APP.user.role !== serverRoleKey || (serverDev.appointment && APP.user.appointment !== serverDev.appointment)) {
              APP.user.role = serverRoleKey;
              APP.user.appointment = serverDev.appointment || APP.user.appointment;
              localStorage.setItem('bace_user', JSON.stringify(APP.user));
              // Preserve user navigation state
              changed = true;
            }
          }
        }
      });

      // Purge devotees that were deleted from the server
      const serverIds = new Set(json.data.map(s => String(s.customId || s._id || s.id || '')));
      const serverEmails = new Set(json.data.map(s => (s.email || '').toLowerCase().trim()).filter(Boolean));

      // If current logged-in devotee was deleted from the server database
      if (APP.user) {
        const curEmail = (APP.user.email || '').toLowerCase().trim();
        const isMaster = APP.user.role === 'admin' || APP.user.role === 'area_leader' || isBaceAdminEmail(curEmail) || isSuryaEmail(curEmail);
        if (!isMaster) {
          const stillExists = json.data.some(s =>
            (s.email && curEmail && s.email.toLowerCase().trim() === curEmail) ||
            (s.customId && APP.user.devotee && s.customId === APP.user.devotee) ||
            (s._id && APP.user.devotee && String(s._id) === String(APP.user.devotee))
          );
          if (!stillExists) {
            APP.user.approvalStatus = 'pending_profile';
            APP.user.profileCompleted = false;
            APP.user.devotee = null;
            localStorage.setItem('bace_user', JSON.stringify(APP.user));
            changed = true;
          }
        }
      }

      const initialCount = DB.devotees.length;
      DB.devotees = DB.devotees.filter(d => {
        if (isBaceAdminEmail(d.email) || d.appointment === 'BACE Administrator' || d.name === 'ISKCON BACE Admin') return false;
        const dId = String(d.id || d.customId || d._id || '');
        const dEmail = (d.email || '').toLowerCase().trim();
        return serverIds.has(dId) || (dEmail && serverEmails.has(dEmail));
      });
      if (DB.devotees.length !== initialCount) changed = true;

      if(changed) render();
    }
  } catch(e){
    console.warn('Server devotees sync notice:', e);
  }
}

function modalHTML(){
  const m=APP.modal;if(!m)return'';
  if(m==='custom')return `<div class="scrim" data-act="close-scrim">${APP.customModalHtml || ''}</div>`;
  if(m==='assign')return assignModal();
  if(m==='calendar-program')return calendarProgramModal();
  if(m==='account'||m==='switch')return accountModal();
  if(m==='notif')return notifDrawer();
  if(m==='search')return searchModal();
  if(m==='delete-devotee-modal')return deleteDevoteeModal();
  if(m==='import-csv')return importCsvModal();
  if(typeof m==='string')return'';
  if(m.kind==='activity')return activityModal(m.id);
  if(m.kind==='contact')return contactDrawer(m.id);
  if(m.kind==='sop')return sopModal(m.id);
  if(m.kind==='form')return formModal();
  if(m.kind==='picker')return pickerModal();
  if(m.kind==='list')return listModal();
  return'';
}

function routeView(){
  try {
    const r=APP.route.replace(/^#\//,'');
    const [seg,arg]=r.split('/');
    APP.crumbLeaf=null;
    const guard=(mod,fn)=>can(mod)?fn():denied();
    switch(seg){
      case '':return viewDashboard();
      case 'today':return viewToday();
      case 'devotees':return guard('directory',viewDevotees);
      case 'devotee':return viewDevotee(arg);
      case 'org':return viewOrg();
      case 'mgmt':return guard('management',viewMgmt);
      case 'depts':return guard('management',viewDepts);
      case 'dept':return guard('management',()=>viewDept(arg));
      case 'assign':return guard('assign',viewAssign);
      case 'attendance':return guard('management',viewAttendance);
      case 'dept-reports':return guard('reports',viewDeptReports);
      case 'inventory':return guard('inventory',viewInventory);
      case 'sops':return viewSops();
      case 'actions':return viewActions();
      case 'preaching':return guard('preaching',viewPreaching);
      case 'batches':return guard('preaching',viewBatches);
      case 'batch':return guard('preaching',()=>viewBatch(arg));
      case 'contacts':return guard('preaching',viewContacts);
      case 'followups':return guard('preaching',viewFollowups);
      case 'classes':return guard('preaching',viewClasses);
      case 'batch-attendance':return guard('preaching',viewBatchAttendance);
      case 'preaching-reports':return guard('reports',viewPreachingReports);
      case 'care':return guard('care',viewCare);
      case 'friends':return guard('care',viewFriends);
      case 'groups':return guard('care',viewGroups);
      case 'group':return guard('care',()=>viewGroup(arg));
      case 'swabhav':return guard('care',viewSwabhav);
      case 'sadhana':return guard('care',viewSadhana);
      case 'facilitators':return guard('care',viewFacilitators);
      case 'spiritual-classes':return guard('care',viewSpiritualClasses);
      case 'camps':return guard('care',viewCamps);
      case 'temple-visits':return guard('care',viewTempleVisits);
      case 'meetings':return viewMeetings();
      case 'care-followups':return guard('care',viewCareFollowups);
      case 'care-reports':return guard('care',viewCareReports);
      case 'reports':return guard('reports',viewReports);
      case 'calendar':return viewCalendar();
      case 'messages':return viewMessages();
      case 'notifications':return viewNotifications();
      case 'admin':return guard('admin',viewAdmin);
      case 'more':return viewMore();
      case 'activity':{const a=act(arg);if(a){APP.modal={kind:'activity',id:arg};}return viewAssign()}
      default:return emptyState('Page not found','That route does not exist in this application.','<a class="btn pri" href="#/">Back to dashboard</a>');
    }
  } catch(err) {
    console.error('Route render error:', err);
    return emptyState('View error', 'Unable to display this view: ' + (err.message || 'Unexpected error'), '<a class="btn pri" href="#/">Back to dashboard</a>');
  }
}
function render(){
  DB.devotees.forEach(normalizeDevotee);
  const app=document.getElementById('app');
  if(!APP.user){app.innerHTML=viewLogin();initGoogleAuth();return}

  // Gating for unapproved devotees:
  const curDevotee = (APP.user.devotee && dv(APP.user.devotee)) || DB.devotees.find(x => x.email && APP.user.email && x.email.trim().toLowerCase() === APP.user.email.trim().toLowerCase());
  const isMasterOrLeader = APP.user.role === 'admin' || APP.user.role === 'area_leader' || isBaceAdminEmail(APP.user.email) || isSuryaEmail(APP.user.email);

  if (!isMasterOrLeader) {
    if (!curDevotee) {
      // Devotee record was deleted from main database
      APP.user.approvalStatus = 'pending_profile';
      APP.user.profileCompleted = false;
      APP.user.devotee = null;
    } else if (curDevotee && curDevotee.status === 'Pending Approval') {
      if (APP.user.approvalStatus === 'approved') {
        APP.user.approvalStatus = APP.user.profileCompleted ? 'pending_approval' : 'pending_profile';
      }
    } else if (curDevotee && curDevotee.status === 'Active' && !['pending_profile', 'pending_approval', 'rejected'].includes(APP.user.approvalStatus)) {
      APP.user.approvalStatus = 'approved';
      APP.user.profileCompleted = true;
    }
  }

  if(APP.user.approvalStatus==='pending_profile' || (!APP.user.profileCompleted && !isMasterOrLeader)){
    app.innerHTML=viewCompleteProfile();
    return;
  }
  if(APP.user.approvalStatus==='pending_approval' && !isMasterOrLeader){
    app.innerHTML=viewPendingApproval();
    return;
  }
  if(APP.user.approvalStatus==='rejected' && !isMasterOrLeader){
    app.innerHTML=viewRejectedApproval();
    return;
  }

  applyAccent(APP.route);
  const body=routeView();
  const shellClass=`shell ${APP.sbClosed?'sb-closed':''} ${APP.mobileDrawerOpen?'mobile-drawer-open':''}`;
  const sbToggleBtn=`<button class="sb-edge-toggle ${APP.sbClosed?'closed':'open'}" data-act="toggle-sidebar" title="${APP.sbClosed?'Open side panel':'Close side panel'}" aria-label="${APP.sbClosed?'Open side panel':'Close side panel'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>`;
  const mobileScrim = APP.mobileDrawerOpen ? `<div class="mobile-scrim" data-act="close-mobile-drawer" aria-label="Close menu"></div>` : '';
  app.innerHTML=`<div class="${shellClass}">${sidebar()}<div class="main">${topbar()}<div class="view">${body}</div></div></div>
    ${mobileScrim}${sbToggleBtn}${botnav()}${fab()}${modalHTML()}`;
  const sb=document.getElementById('sbscroll');
  if(sb){
    let lockScroll = true;
    if(APP.sbScroll > 0) sb.scrollTop = APP.sbScroll;
    setTimeout(()=>{ lockScroll = false; }, 60);
    sb.addEventListener('scroll',()=>{
      if(!lockScroll) APP.sbScroll = sb.scrollTop;
    },{passive:true});
  }
  const cb=document.getElementById('chatbody');if(cb)cb.scrollTop=cb.scrollHeight;
}
function go(r){
  APP.route=r;
  APP.modal='';
  APP.mobileDrawerOpen=false;
  APP.mobileSearchOpen=false;
  if(location.hash!==r)location.hash=r;
  else render();
  window.scrollTo(0,0);
}

      dob: d.dob,
      joined: d.joined,
      org: d.org,
      occupation: d.occupation,
      highestEducation: d.highestEducation || '',
      presentStudiesOrJob: d.presentStudiesOrJob || '',
      residence: d.residence || d.address || '',
      attendanceMode: d.attendanceMode || 'Offline at BACE',
      batchRole: d.batchRole || 'Member',
      level: d.level !== undefined ? Number(d.level) : 1,
      address: d.address,
      emergency: d.emergency,
      dept: d.dept || null,
      batch: d.batch || null,
      careGroup: d.careGroup || null,
      facilitator: d.facilitator || null,
      availability: d.availability,
      status: d.status,
      source: d.source,
      skills: d.skills || [],
      sadhana: d.sadhana || { rounds: 16, morningProgram: 0 },
      appointment: rObj.name,
      isFacilitator: (rKey === 'facilitator'),
      role: rKey,
      customId: d.customId || d.id
    };
    const targetId = d._id || d.id;
    const res = await fetch(`/api/devotees/${targetId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload)
    });
    if(!res.ok && (res.status === 404 || res.status === 400)){
      const postRes = await fetch('/api/devotees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(payload)
      });
      if(postRes.ok){
        const json = await postRes.json();
        if(json.data && json.data._id) d._id = String(json.data._id);
      }
    }
  }catch(e){
    console.warn('Backend devotee sync notice:', e);
  }
}
async function deleteDevoteeAction(id){
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  const isMe = APP.user && (
    APP.user.devotee === id ||
    (d && (APP.user.devotee === d.id || APP.user.devotee === d.customId || (d.email && APP.user.email && d.email.toLowerCase().trim() === APP.user.email.toLowerCase().trim())))
  );
  try{
    toast(`Deleting ${name}...`, '⏳');
    if(token){
      const res = await fetch(`/api/devotees/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(!res.ok && res.status !== 404){
        const data = await res.json().catch(()=>({}));
        throw new Error(data.message || 'Failed to delete on server');
      }
    }
    // Remove from local in-memory DB
    const idx = DB.devotees.findIndex(x => x.id === id || x.customId === id);
    if(idx !== -1) DB.devotees.splice(idx, 1);

    DB.assignments = DB.assignments.filter(a => a.devotee !== id);
    DB.attendance = DB.attendance.filter(a => a.devotee !== id);
    DB.deptMembers = DB.deptMembers.filter(m => m.devotee !== id);
    DB.careGroups.forEach(g => { g.members = (g.members||[]).filter(m => m !== id); });
    DB.users = (DB.users || []).filter(u => u.devotee !== id && (d && d.email ? u.email !== d.email : true));

    logAudit('Devotee Deleted', `${name} deleted from database`);

    if(isMe){
      localStorage.removeItem('bace_token');
      localStorage.removeItem('bace_user');
      APP.user = null;
      APP.modal = '';
      APP.deleteDevoteeTarget = null;
      toast('Your devotee account was deleted. Please register again.', '⚠️');
      render();
      return;
    }

    toast(`${name} deleted from database`, '🗑️');
    APP.modal = '';
    APP.deleteDevoteeTarget = null;
    if(APP.route.startsWith('#/devotee/')){
      go('#/devotees');
    } else {
      render();
    }
  }catch(err){
    console.error(err);
    toast(err.message || 'Delete failed', '❌');
  }
}


async function approveDevoteeAction(id){
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  try{
    toast(`Approving ${name}...`, '⏳');
    if(token){
      const res = await fetch(`/api/auth/approve-devotee/${id}`,{
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + token}
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error(data.message || 'Approval failed on server');
    }
    if(d){
      d.status = 'Active';
    }
    const u = DB.users.find(x => x.devotee === id || x.id === id);
    if(u){
      u.approvalStatus = 'approved';
    }
    logAudit('Devotee Approved', `${name} approved by Area Leader`);
    toast(`${name} approved successfully! They can now log in.`, '✅');
    render();
  }catch(err){
    console.error(err);
    toast(err.message || 'Approval failed', '❌');
  }
}

async function rejectDevoteeAction(id){
  const reason = prompt('Please enter the reason for rejection (optional):');
  if(reason === null) return;
  const token = localStorage.getItem('bace_token');
  const d = dv(id) || DB.devotees.find(x => x.id === id || x.customId === id);
  const name = d ? d.name : 'Devotee';
  try{
    if(token){
      await fetch(`/api/auth/reject-devotee/${id}`,{
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
        body: JSON.stringify({reason})
      });
    }
    if(d){ d.status = 'Inactive'; }
    const u = DB.users.find(x => x.devotee === id || x.id === id);
    if(u){ u.approvalStatus = 'rejected'; u.rejectionReason = reason; }
    logAudit('Devotee Rejected', `${name} registration declined: ${reason || 'No reason specified'}`);
    toast(`Registration for ${name} declined`, 'ℹ️');
    render();
  }catch(err){
    console.error(err);
    toast(err.message || 'Action failed', '❌');
  }
}

  el.focus();if(caretEnd&&el.setSelectionRange&&el.type!=='date'&&el.type!=='number'){const v=el.value;try{el.setSelectionRange(v.length,v.length)}catch(e){}}
}

  if(!t){return}
  const a=t.dataset.act,id=t.dataset.id;

  if(t.tagName==='A'&&t.getAttribute('href')&&t.getAttribute('href').startsWith('#/')&&['drill'].includes(a)===false&&!['open-devotee','open-activity','open-contact','open-dept','open-batch','open-group','open-sop'].includes(a)){
    e.preventDefault();go(t.getAttribute('href'));return}
  const stop=()=>{e.preventDefault();e.stopPropagation()};
  switch(a){
  /* ---- session / navigation ---- */
  case 'pick-user':loginPick=id;render();break;
  case 'login':{const u=DB.users.find(x=>x.id===loginPick);APP.user={...u};
    APP.nav.open = getSavedNavOpen();
    go('#/');break}
  case 'account':APP.modal='account';render();break;
  case 'switch-user':APP.modal='account';render();break;
  case 'logout':localStorage.removeItem('bace_token');localStorage.removeItem('bace_user');APP.user=null;APP.modal='';render();toast('Signed out successfully','👋');break;

  case 'reject-devotee':stop();rejectDevoteeAction(id);break;
  case 're-apply':if(APP.user)APP.user.approvalStatus='pending_profile';render();break;
  case 'go':go(t.dataset.r);break;
  case 'drill':go(t.dataset.r);break;
  case 'pillar': {
    stop();
    const k = t.dataset.k;
    APP.nav.open[k] = !APP.nav.open[k];
    saveNavOpen();
    const pillarEl = t.closest('.pillar');
    if (pillarEl) {
      const isOpen = !!APP.nav.open[k];
      t.classList.toggle('open', isOpen);
      t.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      const bodyEl = pillarEl.querySelector('.pillar-body');
      if (bodyEl) {
        bodyEl.style.display = isOpen ? 'block' : 'none';
      }
    } else {
      render();

    break;

/* chart tooltips */
(function tooltips(){
  let tip;
  const show=(el,x,y)=>{
    const txt=el.getAttribute('data-tip');if(!txt)return;
    if(!tip){tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip)}
    const lines=txt.split('\n');
    tip.innerHTML=`<b>${esc(lines[0])}</b>${lines.slice(1).map(l=>`<br>${esc(l)}`).join('')}`;
    tip.style.display='block';
    const w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.min(window.innerWidth-w-10,Math.max(8,x-w/2))+'px';
    tip.style.top=(y-h-12<8?y+18:y-h-12)+'px';
  };
  const hide=()=>{if(tip)tip.style.display='none'};
  document.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tip]');
    if(el)show(el,e.clientX,e.clientY);else hide();
  });
  document.addEventListener('touchstart',e=>{
    const el=e.target.closest('[data-tip]');
    if(el){const t0=e.touches[0];show(el,t0.clientX,t0.clientY);setTimeout(hide,2600)}
  },{passive:true});
  window.addEventListener('scroll',hide,{passive:true});
})();

async function verifyUserSessionFromServer(){
  const token = localStorage.getItem('bace_token');
  if (!token || !APP.user) return;
  const curEmail = (APP.user.email || '').toLowerCase().trim();
  if (isBaceAdminEmail(curEmail) || isSuryaEmail(curEmail)) return;
  try {
    const res = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem('bace_token');
        localStorage.removeItem('bace_user');
        APP.user = null;
        render();
      }
      return;
    }
    const data = await res.json();
    if (data.success && data.user) {
      const u = data.user;
      let changed = false;
      if (APP.user.approvalStatus !== u.approvalStatus) {
        APP.user.approvalStatus = u.approvalStatus;
        changed = true;
      }
      if (APP.user.profileCompleted !== u.profileCompleted) {
        APP.user.profileCompleted = !!u.profileCompleted;
        changed = true;
      }
      if (u.role && APP.user.role !== u.role) {
        APP.user.role = u.role;
        APP.user.appointment = u.appointment || '';
        changed = true;
      }
      if (changed) {
        localStorage.setItem('bace_user', JSON.stringify(APP.user));
        // Preserve user navigation state
        render();
      }
    }
  } catch (err) {
    console.warn('verifyUserSessionFromServer notice:', err);
  }
}
